<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wilvan Wee — Alluora</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0F1020;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px 16px;
    }

    /* Atmospheric blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 480px; height: 480px;
      top: -120px; left: -100px;
      background: rgba(63, 46, 110, 0.55);
    }
    body::after {
      width: 500px; height: 500px;
      bottom: -80px; right: -60px;
      background: rgba(145, 91, 153, 0.45);
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      background: linear-gradient(160deg, #1A1830 0%, #141223 100%);
      border: 1px solid rgba(240, 218, 170, 0.22);
      border-radius: 28px;
      padding: 36px 28px 32px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.55);
    }

    /* Brand header */
    .brand {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: #EED8A2;
      margin-bottom: 4px;
    }
    .brand-sub {
      font-size: 11px;
      color: #6A677F;
      letter-spacing: 0.08em;
      margin-bottom: 28px;
    }

    /* Avatar + identity */
    .identity {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }
    .avatar {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: #24233D;
      border: 2px solid #E0C37E;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 700; color: #F7F1E4;
      flex-shrink: 0;
      letter-spacing: 0.05em;
    }
    .name {
      font-size: 28px;
      font-weight: 700;
      color: #F7F1E4;
      line-height: 1.1;
      margin-bottom: 5px;
    }
    .role-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .role { font-size: 14px; color: #E0C37E; }
    .dot { color: #857FA9; }
    .company { font-size: 14px; color: #BFB8E5; }
    .location { font-size: 13px; color: #9E9BBE; margin-top: 3px; }

    /* Divider */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      margin: 20px 0;
    }

    /* Contact rows */
    .contact-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      background: linear-gradient(135deg, #23213A, #1B1A2D);
      border: 1px solid #3E3B59;
      border-radius: 14px;
      margin-bottom: 10px;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .contact-row:hover {
      border-color: #6B67A0;
      background: linear-gradient(135deg, #282640, #201F33);
    }
    .contact-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .contact-icon svg { width: 16px; height: 16px; }
    .contact-text { flex: 1; min-width: 0; }
    .contact-label { font-size: 11px; color: #A19CBF; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 2px; }
    .contact-value { font-size: 15px; font-weight: 600; color: #F5F1E8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* QR section */
    .qr-section {
      margin-top: 22px;
      background: linear-gradient(135deg, #F1E6C7, #DDC88F);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
    }
    .qr-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #5B4820;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .qr-sublabel {
      font-size: 12px;
      color: #7A6030;
      margin-bottom: 14px;
    }
    #qrcode {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }
    #qrcode canvas, #qrcode img {
      border-radius: 8px;
    }
    .qr-footer {
      font-size: 11px;
      color: #6B5228;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">ALLUORA</div>
    <div class="brand-sub">Digital Namecard</div>

    <div class="identity">
      <div class="avatar">WW</div>
      <div>
        <div class="name">Wilvan Wee</div>
        <div class="role-row">
          <span class="role">Business Director</span>
          <span class="dot">•</span>
          <span class="company">Alluora</span>
        </div>
        <div class="location">Singapore</div>
      </div>
    </div>

    <div class="divider"></div>

    <a class="contact-row" href="tel:+6584683560">
      <div class="contact-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#EED8A2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 10.8a19.79 19.79 0 01-3.07-8.68A2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 14.92z"/>
        </svg>
      </div>
      <div class="contact-text">
        <div class="contact-label">Mobile</div>
        <div class="contact-value">+65 8468 3560</div>
      </div>
    </a>

    <a class="contact-row" href="mailto:wilvanwee@alluora.com">
      <div class="contact-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#EED8A2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </div>
      <div class="contact-text">
        <div class="contact-label">Email</div>
        <div class="contact-value">wilvanwee@alluora.com</div>
      </div>
    </a>

    <a class="contact-row" href="https://alluora.com" target="_blank" rel="noopener">
      <div class="contact-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#EED8A2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/>
        </svg>
      </div>
      <div class="contact-text">
        <div class="contact-label">Website</div>
        <div class="contact-value">alluora.com</div>
      </div>
    </a>

    <div class="qr-section">
      <div class="qr-label">Save Contact</div>
      <div class="qr-sublabel">Scan to add Wilvan to your phone</div>
      <div id="qrcode"></div>
      <div class="qr-footer">Tap any row above to call, email, or visit</div>
    </div>
  </div>

  <script>
    const vcard = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "FN:Wilvan Wee",
      "N:Wee;Wilvan;;;",
      "ORG:Alluora",
      "TITLE:Business Director",
      "TEL;TYPE=CELL:+6584683560",
      "EMAIL:wilvanwee@alluora.com",
      "URL:https://alluora.com",
      "END:VCARD"
    ].join("\n");

    new QRCode(document.getElementById("qrcode"), {
      text: vcard,
      width: 200,
      height: 200,
      colorDark: "#241B0A",
      colorLight: "#F1E6C7",
      correctLevel: QRCode.CorrectLevel.M
    });
  </script>
</body>
</html>
